apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: pensionat-customer-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:mysql://customer-db:3306/customer_db
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: customer-secrets
                  key: JWT_SECRET
            - name: BOOKING_SERVICE_URL
              value: http://pensionat-app:8083

---

apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  type: LoadBalancer
  selector:
    app: customer-service
  ports:
    - port: 8081
      targetPort: 8081


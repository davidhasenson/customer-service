name: CI/CD Pipeline # Build once, Deploy anywhere

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# -------------------------------------------------------------
# JOB 1: BUILD AND TEST
# -------------------------------------------------------------
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
        java:
          - 17
        #  - 21

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_TEST_DATABASE }}
        ports:
          - 3306:3306
        options:
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: ${{matrix.java}}
          distribution: "temurin"
          cache: "maven"

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Run Tests
        run: mvn -B test
        env:
          DB_URL: ${{ vars.SPRING_DATASOURCE_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  # -------------------------------------------------------------
  # JOB 2: BUILD AND PUSH DOCKER IMAGE TO CONTAINER REGISTRY
  # -------------------------------------------------------------
  push-to-container-registry:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:


      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
#        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and tags for Docker image
#        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image to GitHub Container Registry
#        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      #          tags: |
      #            ghcr.io/${{ github.repository_owner }}/customer-service:build${{ github.run_number }}
      #            ghcr.io/${{ github.repository_owner }}/customer-service:${{ github.sha }}
      #            ghcr.io/${{ github.repository_owner }}/customer-service:latest

      - name: Print image digest
#        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest is: ${{ steps.build.outputs.digest }}"
          echo "Full image path: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

# -------------------------------------------------------------
# JOB 3: DEPLOY TO STAGING (Automatic on push to master)
# -------------------------------------------------------------
  deploy-staging:
    needs: push-to-container-registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway Redeploy with Image Digest
    run: |
      DIGEST="${{ needs.push-to-container-registry.outputs.image_digest }}"
      IMAGE_WITH_DIGEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

    echo "Deploying image: ${IMAGE_WITH_DIGEST}"

      curl -X POST https://api.railway.app/graphql \
    -H "Content-Type: application/json" \
    -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
      -d "{
    \"query\":
      \"mutation { serviceInstanceUpdate(id:
        \\\"3b7b8949-96ed-434d-8726-c6a610a64612\\\", input: { source: { image: \\\"${ IMAGE_WITH_DIGEST }\\\" } }) { id } }\"}"


# -------------------------------------------------------------
# JOB 4: DEPLOY TO PRODUCTION (Manual trigger or Git tag)
# -------------------------------------------------------------
  deploy-production:
    needs: push-to-container-registry
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Production

      - name: Trigger Railway Redeploy with Digest
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          IMAGE_WITH_DIGEST="ghcr.io/davidhasenson/customer-service@${DIGEST}"
          
          curl -X POST https://api.railway.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d "{
              \"query\": \"mutation { serviceInstanceUpdate(id: \\\"3b7b8949-96ed-434d-8726-c6a610a64612\\\", input: {source: {image: \\\"${IMAGE_WITH_DIGEST}\\\"}}) { id } }\"
            }"
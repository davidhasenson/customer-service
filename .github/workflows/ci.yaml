name: CI with integration tests

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build:
    runs-on: ${{ matrix.os }}

#    Used by GitHub Container Registry
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

#      - name: Log in to Docker Hub
#        if: github.event_name == 'push'
#        uses: docker/login-action@v3
#        with:
#          username: ${{ vars.DOCKER_USERNAME }}
#          password: ${{ secrets.DOCKER_TOKEN }}
#
#      - name: Build and push to Docker Hub
#        if: github.event_name == 'push'
#        uses: docker/build-push-action@v6
#        with:
#          context: .
#          push: true
#          tags: |
#            ${{ vars.DOCKER_USERNAME }}/customer-service:v${{ github.run_number }}
#            ${{ vars.DOCKER_USERNAME }}/customer-service:v${{ github.sha }}
#            ${{ vars.DOCKER_USERNAME }}/customer-service:latest

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        if: github.event_name == 'push'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/customer-service:v${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/customer-service:v${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/customer-service:latest
            
      - name: Print image digest
        run: |
          echo "Image digest is: ${{ steps.build.outputs.digest }}"
          echo "Full image path: ghcr.io/${{ github.repository_owner }}/customer-service@${{ steps.build.outputs.digest }}"
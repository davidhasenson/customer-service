name: CI/CD Pipeline # Build once, Deploy anywhere

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Ange image-tagg/SHA att deploya (t.ex. sha-4662254, latest eller a1b2c3d)'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# -------------------------------------------------------------
# JOB 1: BUILD AND TEST
# -------------------------------------------------------------
jobs:
  build-and-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
        java:
          - 17
        #  - 21

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_TEST_DATABASE }}
        ports:
          - 3306:3306
        options:
          --health-cmd="mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: ${{matrix.java}}
          distribution: "temurin"
          cache: "maven"

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Run Tests
        run: mvn -B test
        env:
          DB_URL: ${{ vars.SPRING_DATASOURCE_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  # -------------------------------------------------------------
  # JOB 2: BUILD AND PUSH DOCKER IMAGE TO CONTAINER REGISTRY
  # -------------------------------------------------------------
  push-to-container-registry:
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
#        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and tags for Docker image
#        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image to GitHub Container Registry
#        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image digest
#        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest is: ${{ steps.build.outputs.digest }}"
          echo "Full image path: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

# -------------------------------------------------------------
# JOB 3: DEPLOY TO STAGING (Automatic on push to master)
# -------------------------------------------------------------
  deploy-staging:
    needs: push-to-container-registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to Staging GHCR Repository
        run: |
          ORIGINAL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.push-to-container-registry.outputs.image_digest }}"
          STAGING_IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/customer-service-staging"

          docker pull $ORIGINAL_IMAGE

          docker tag $ORIGINAL_IMAGE ${STAGING_IMAGE}:latest

          docker push ${STAGING_IMAGE}:latest

      - name: Deployment to railway
        run: npx -y @railway/cli@latest redeploy --service "${{ secrets.RAILWAY_SERVICE_ID_STAGING }}" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}

# -------------------------------------------------------------
# JOB 4: DEPLOY TO PRODUCTION (Manual trigger or Git tag)
# -------------------------------------------------------------
  deploy-production:
    needs: push-to-container-registry
    if: | 
      !failed() && 
      !cancelled() && 
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to Production GHCR Repository
        run: |
          CHOSEN_TAG="${{ inputs.image_tag }}"

          echo "Hämtar image med tagg: $CHOSEN_TAG"

          ORIGINAL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$CHOSEN_TAG"
          PROD_IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/customer-service-production"

          docker pull $ORIGINAL_IMAGE

          docker tag $ORIGINAL_IMAGE ${PROD_IMAGE}:latest

          docker push ${PROD_IMAGE}:latest

      - name: Deployment to railway
        run: npx -y @railway/cli@latest redeploy --service "${{ secrets.RAILWAY_SERVICE_ID_PRODUCTION }}" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}

